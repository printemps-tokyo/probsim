name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release
      # A fixed seed, so the self-check is deterministic.
      - run: ./target/release/probsim all --seed 2026 --check
      # Every JSON shape must parse.
      - name: JSON output parses
        run: |
          b=./target/release/probsim
          for args in "all --trials 2000 --seed 1" "monty-hall --random-host --explain 3 --trials 500" \
                      "coupon --trials 3" "buffon --trials 1" "birthday --people 1 --trials 10" \
                      "benford --trials 50" "benford --source fibonacci --trials 5000" \
                      "benford --digits 2 --trials 5000" "base-rate --explain 2 --trials 500" \
                      "penney --trials 500" "boy-girl --trials 500" "bertrand --method radius --trials 500" \
                      "gacha --weights 1,1,0.2 --budget 20 --trials 500" \
                      "sweep birthday --vary people --from 1 --to 30 --trials 500" \
                      "coverage monty-hall --runs 20 --trials 100"; do
            $b $args --json | python3 -m json.tool > /dev/null
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.82
      - run: cargo test --all
