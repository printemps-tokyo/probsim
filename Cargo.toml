[package]
name = "probsim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Watch probability paradoxes converge next to their exact answers: Monty Hall, the birthday paradox, gacha completion, the secretary problem, Buffon's needle and Benford's law (also on your own data). Zero-dependency Rust CLI."
authors = ["printemps.tokyo <develop@printemps.tokyo>"]
repository = "https://github.com/printemps-tokyo/probsim"
homepage = "https://github.com/printemps-tokyo/probsim"
readme = "README.md"
keywords = ["probability", "simulation", "monte-carlo", "paradox", "education"]
categories = ["command-line-utilities", "simulation", "mathematics"]

[[bin]]
name = "probsim"
path = "src/main.rs"

[lib]
name = "probsim"
path = "src/lib.rs"

[dependencies]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
