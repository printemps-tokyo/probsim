[package]
name = "probsim"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Watch probability paradoxes converge next to their exact answers: Monty Hall, the birthday paradox, gacha completion, the secretary problem, Buffon's needle, the base rate fallacy, Penney's game, the boy or girl paradox, Bertrand's paradox and Benford's law (also on your own data). Sweeps, coverage studies, play mode, CSV and SVG. Zero-dependency Rust CLI."
authors = ["printemps.tokyo <develop@printemps.tokyo>"]
repository = "https://github.com/printemps-tokyo/probsim"
homepage = "https://github.com/printemps-tokyo/probsim"
readme = "README.md"
keywords = ["probability", "simulation", "monte-carlo", "paradox", "education"]
categories = ["command-line-utilities", "simulation", "mathematics"]

[[bin]]
name = "probsim"
path = "src/main.rs"

[lib]
name = "probsim"
path = "src/lib.rs"

[dependencies]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
